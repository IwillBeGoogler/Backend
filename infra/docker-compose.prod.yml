# Production override. Use together with the base files:
#
#   cp .env.prod.example .env.prod      # fill every CHANGE_ME (see deploy/README.md)
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes: Caddy is the only published service (80/443); no host ports for postgres/redis/minio/emqx/web/admin;
# mailpit disabled; Postgres/Redis on the host (systemd) instead of containers; the Go services read their secrets from
# Vault themselves; the dev Backend/.env is not read; restart policies, memory/CPU limits
# sized for a 4 GB VPS (see deploy/README.md for 2 GB), log rotation, read-only filesystems where the image allows it.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  restart: unless-stopped

# Everything the Go services read. Anything not listed keeps the code default (see Backend/config/config.go).
# Only non-secret values live here. Secrets (DATABASE_URL, REDIS_URL, S3_*_KEY, MFA_KEY, ...) are read by the app
# itself from Vault (Backend/config/vault.go: KEY -> KEY_FILE -> Vault) with the AppRole secret_id that
# iwillbegoogler-secrets renders into /run/iwillbegoogler/secrets (tmpfs, 0400, uid 65532). They are kept only in process
# memory: `docker inspect` and /proc/1/environ show the file path, never a value. Do NOT add a secret key here, not even
# as an empty default: a set env var wins over Vault.
x-app-env: &app-env
  APP_ENV: production
  DB_MAX_CONNS: "15"
  DB_MIN_CONNS: "1"
  S3_ENDPOINT: minio:9000
  S3_BUCKET: ${S3_BUCKET:-uploads}
  S3_USE_SSL: "false"
  MQTT_URL: tcp://emqx:1883
  MQTT_USERNAME: api
  MQTT_PUBLIC_WS_PATH: /mqtt
  SMTP_ADDR: ${SMTP_ADDR:-smtp-relay:587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_TLS: ${SMTP_TLS:-none}
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
  SITE_URL: https://${DOMAIN:?set DOMAIN}
  PUBLIC_URL: https://${DOMAIN}
  CORS_ORIGINS: https://${DOMAIN},https://${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
  SITE_NAME: ${SITE_NAME:-IWillBeGoogler}
  TRUST_PROXY: "true" # X-Real-IP comes from Caddy (docker network 172.16.0.0/12, in the default TRUSTED_PROXIES)
  ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
  METRICS_ADDR: ":9090"
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  EMQX_API_URL: http://emqx:18083 # without it revoked clients stay connected
  EMQX_API_KEY: ${EMQX_API_KEY:-iwillbegoogler-api}
  # Vault (values written by `iwillbegoogler-secrets render`, none of them secret)
  VAULT_ADDR: ${VAULT_ADDR:?render the env with iwillbegoogler-secrets}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:?render the env with iwillbegoogler-secrets}
  VAULT_KV_PATH: ${VAULT_KV_PATH:?render the env with iwillbegoogler-secrets}
  VAULT_SECRET_ID_FILE: /run/iwillbegoogler/secrets/vault_secret_id
  VAULT_CACERT: ${VAULT_CACERT_PATH:-}

# Read-only tmpfs dir with the AppRole secret_id (and the Vault CA when one is configured).
x-vault-mount: &vault-mount
  - /run/iwillbegoogler/secrets:/run/iwillbegoogler/secrets:ro

# Postgres, Redis (and optionally MongoDB) run on the host under systemd (deploy/server/datastores.sh). They listen
# on the gateway of the fixed network below, so only containers of this stack (and localhost) reach them.
# HOST_GATEWAY (default 172.30.0.1) is that address.

# nginx master starts as root, binds :80, then workers drop to the nginx user.
x-nginx: &nginx
  read_only: true
  tmpfs:
    - /tmp
    - /var/run
    - /var/cache/nginx
    - /etc/nginx/conf.d
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]

services:
  caddy:
    <<: *hardened
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS:-0.0.0.0/0 ::/0}
      SITE_SCHEME: ${SITE_SCHEME:-} # http:// behind the host nginx (deploy/proxy), empty = Caddy does HTTPS itself
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5" }

  web:
    <<: [*hardened, *nginx]
    image: ${IMAGE_REGISTRY:-docker.io/bakhod1r}/iwillbegoogler-web:${TAG_WEB:-${IMAGE_TAG:-prod}}
    ports: !reset []
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.5" }

  admin:
    <<: [*hardened, *nginx]
    image: ${IMAGE_REGISTRY:-docker.io/bakhod1r}/iwillbegoogler-admin:${TAG_ADMIN:-${IMAGE_TAG:-prod}}
    ports: !reset []
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.25" }

  api:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-docker.io/bakhod1r}/iwillbegoogler-api:${TAG_API:-${IMAGE_TAG:-prod}}
    env_file: !reset []
    environment: !override # drop the dev values of Backend/docker-compose.yml (DATABASE_URL=...@postgres, ...)
      <<: *app-env
      WORKER: "false"
      MIGRATE_ON_START: "false"
    volumes: *vault-mount
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.5" }

  worker:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-docker.io/bakhod1r}/iwillbegoogler-worker:${TAG_API:-${IMAGE_TAG:-prod}}
    env_file: !reset []
    environment: !override # drop the dev values of Backend/docker-compose.yml (DATABASE_URL=...@postgres, ...)
      <<: *app-env
      MIGRATE_ON_START: "false"
    volumes: *vault-mount
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1" }

  migrate:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-docker.io/bakhod1r}/iwillbegoogler-migrate:${TAG_API:-${IMAGE_TAG:-prod}}
    restart: "no"
    env_file: !reset []
    environment: !override # drop the dev values of Backend/docker-compose.yml (DATABASE_URL=...@postgres, ...)
      <<: *app-env
      MIGRATE_ON_START: "false"
    volumes: *vault-mount
    depends_on: !reset {}
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: { memory: 128M }

  # Postgres and Redis run on the host under systemd (deploy/server/datastores.sh); the containers never start here.
  postgres:
    profiles: ["disabled"]

  redis:
    profiles: ["disabled"]

  minio:
    <<: *hardened
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      MINIO_BROWSER: "off"
    ports: !reset []
    read_only: true
    healthcheck: # mc keeps its config in $HOME, which is read-only here
      test: ["CMD", "mc", "--config-dir", "/tmp/mc", "ready", "local"]
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: { memory: 400M, cpus: "0.5" }

  emqx:
    <<: *hardened
    environment:
      # overrides node.cookie of the mounted emqx.conf, and refuses to start without one
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?set EMQX_NODE_COOKIE}
    ports: !reset []
    deploy:
      resources:
        limits: { memory: 700M, cpus: "1" }

  # Optional relay: unused when SMTP_ADDR points at your provider (stop it with "dc stop smtp-relay").
  smtp-relay:
    <<: *hardened
    image: boky/postfix:v4.4.0
    environment:
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USERNAME:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      ALLOWED_SENDER_DOMAINS: ${SMTP_SENDER_DOMAINS:-${DOMAIN}}
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.25" }

  # Never started in production: nothing depends on it once api's depends_on is replaced above.
  mailpit:
    profiles: ["dev-mail"]

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}

  postgres-exporter:
    environment:
      DATA_SOURCE_NAME: postgres://blog:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@${HOST_GATEWAY:-172.30.0.1}:5432/blog?sslmode=disable
    depends_on: !reset {}

  redis-exporter:
    environment:
      REDIS_ADDR: redis://${HOST_GATEWAY:-172.30.0.1}:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on: !reset {}

  # Daily pg_dump into volume pgbackups, optional offsite upload and blob mirror (deploy/README.md, section 4).
  pgbackup:
    <<: *hardened
    build: deploy/backup
    depends_on: !reset {}
    environment:
      PGHOST: ${HOST_GATEWAY:-172.30.0.1}
      PGUSER: blog
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: blog
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-0}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-iwillbegoogler/postgres}
      BACKUP_MIRROR: ${BACKUP_MIRROR:-0}
      BACKUP_MIRROR_SRC_ENDPOINT: ${BACKUP_MIRROR_SRC_ENDPOINT:-http://minio:9000}
      BACKUP_MIRROR_SRC_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      BACKUP_MIRROR_SRC_SECRET_KEY: ${S3_SECRET_KEY:-}
      BACKUP_MIRROR_SRC_BUCKET: ${S3_BUCKET:-uploads}
      BACKUP_MIRROR_PREFIX: ${BACKUP_MIRROR_PREFIX:-iwillbegoogler/objects}
    volumes:
      - pgbackups:/backups
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/postgresql
    healthcheck: # unhealthy when the newest scheduled dump is older than 26 h (manual blog-<name>.dump files do not count)
      test: ["CMD-SHELL", "find /backups -name 'blog-[0-9]*.dump' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 26h
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5" }

volumes:
  pgbackups:
  caddydata:
  caddyconfig:

# Fixed, pre-created network (deploy/server/install.sh): its gateway 172.30.0.1 is where the host's Postgres/Redis/MongoDB
# listen, so the address exists before compose runs and survives `compose down`.
networks:
  default:
    name: iwillbegoogler
    external: true
