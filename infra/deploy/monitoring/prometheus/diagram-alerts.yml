# Diagram / realtime alerts. Loaded by the compose Prometheus (rule_files in docker-compose.yml).
# The stored-updates threshold assumes the default hub CompactAfter=50 (Backend/internal/interfaces/diagramhub/hub.go): 2x = 100.
# Adjust if you change CompactAfter.
groups:
  - name: iwillbegoogler-diagrams
    rules:
      - alert: YjsBatchWriteFailing
        expr: increase(iwillbegoogler_yjs_batch_write_failures_total[5m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Yjs batch writes failing on {{ $labels.instance }}"
          description: "Collaborative edits are not reaching Postgres; check DB health and API logs."

      - alert: YjsStoredUpdatesHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(iwillbegoogler_yjs_stored_updates_bucket[10m]))) > 100
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "p95 stored Yjs updates above 2x compact threshold"
          description: "Compaction is not keeping up (default threshold 50). See iwillbegoogler_yjs_compactions_refused_total."

      - alert: DiagramApi5xxRate
        expr: |
          sum(rate(http_requests_total{route=~".*/api/diagrams.*", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{route=~".*/api/diagrams.*"}[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 2% of /api/diagrams requests return 5xx"

      - alert: YjsCompactionsRefusedSpike
        expr: increase(iwillbegoogler_yjs_compactions_refused_total[15m]) > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Yjs compactions are being refused"
          description: "Snapshots do not cover all stored updates; clients may be sending stale snapshots."

      - alert: WebhookFailuresHigh
        expr: |
          sum(rate(iwillbegoogler_webhook_attempts_total{result!="2xx"}[15m]))
            / clamp_min(sum(rate(iwillbegoogler_webhook_attempts_total[15m])), 1e-9) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than half of webhook attempts are failing"
          description: "See iwillbegoogler_webhook_attempts_total by result; a single broken endpoint can cause this."
