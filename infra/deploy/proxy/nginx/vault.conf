# Host nginx -> Vault/OpenBao (127.0.0.1:8200, plain HTTP on loopback only). Installed by deploy/server/nginx.sh.
# Vault trusts X-Forwarded-For from 127.0.0.1 only (deploy/vault/install-server.sh), so AppRole CIDR binding sees the
# real client: the server's public IP (host) or 172.30.0.0/24 (containers), GitHub runners for JWT logins.
server {
	listen 80;
	listen [::]:80;
	server_name @VAULT_DOMAIN@;
	location /.well-known/acme-challenge/ { root /var/www/html; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name @VAULT_DOMAIN@;
	ssl_certificate /etc/letsencrypt/live/@VAULT_DOMAIN@/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/@VAULT_DOMAIN@/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	server_tokens off;
	client_max_body_size 1m;

	# The UI is not needed: operators use the CLI over SSH (VAULT_ADDR=http://127.0.0.1:8200).
	location /ui/ { return 404; }
	location /v1/sys/ { # unseal, init, raw, ... only from the server itself
		allow 127.0.0.1;
		deny all;
		proxy_pass http://127.0.0.1:8200;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
	}
	location /v1/sys/wrapping/unwrap { # the server's iwillbegoogler-secrets accept
		proxy_pass http://127.0.0.1:8200;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
	}
	location / {
		proxy_pass http://127.0.0.1:8200;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
	}
}
