# Server-local Vault endpoint for the secrets helper and the containers: https://172.30.0.1:8443 (gateway of the docker
# network iwillbegoogler), TLS with a private CA (deploy/server/vault-internal.sh). Never reachable from outside: the
# address exists only on this host. ip_nonlocal_bind lets nginx start before dockerd creates the bridge.
server {
	listen 172.30.0.1:8443 ssl;
	http2 on;
	server_name _;
	ssl_certificate /etc/iwillbegoogler/pki/vault-internal.crt;
	ssl_certificate_key /etc/iwillbegoogler/pki/vault-internal.key;
	ssl_protocols TLSv1.3;
	server_tokens off;
	client_max_body_size 1m;

	location /v1/sys/wrapping/unwrap { proxy_pass http://127.0.0.1:8200; proxy_set_header X-Forwarded-For $remote_addr; }
	location /v1/sys/ { return 403; }
	location /ui/ { return 404; }
	location / {
		proxy_pass http://127.0.0.1:8200;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
	}
}
