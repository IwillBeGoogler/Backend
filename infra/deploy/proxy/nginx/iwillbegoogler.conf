# Host nginx -> Caddy (compose, 127.0.0.1:8088) for the site and the admin panel. Installed by deploy/server/nginx.sh,
# which substitutes @DOMAIN@ and @ADMIN_DOMAIN@ and gets the certificates with certbot.
map $http_upgrade $iwbg_connection_upgrade { default upgrade; '' close; }

upstream iwbg_caddy {
	server 127.0.0.1:8088;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name @DOMAIN@ www.@DOMAIN@ @ADMIN_DOMAIN@;
	location /.well-known/acme-challenge/ { root /var/www/html; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.@DOMAIN@;
	ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	return 301 https://@DOMAIN@$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name @DOMAIN@ @ADMIN_DOMAIN@;
	ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;

	client_max_body_size 110m;
	server_tokens off;

	location / {
		proxy_pass http://iwbg_caddy;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		# SSE (/api/.../stream) and the MQTT WebSocket (/mqtt)
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $iwbg_connection_upgrade;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
