name: CD

# Release pipeline for main (production) and dev (dev): build -> scan -> push images, then hand the
# deploy to the infra repo. Production runs docker compose from
# bakhod1r/iwillbegoogler-infra (env rendered from Vault on the server); this
# repo no longer touches the server. _deploy.yml and _env.yml (SSH deploy) are
# kept but unused here: dev-only legacy.
#   meta -> build -> scan -> push -> deploy (repository_dispatch to infra) -> notify
# Images: docker.io/bakhod1r/iwillbegoogler-{migrate,api,worker}:<short sha>
#
# Secrets come from Vault via GitHub OIDC (JWT auth), none from GitHub secrets
# except the optional TELEGRAM_BOT_TOKEN:
#   role iwillbegoogler-ci-images (main -> production, dev -> dev)
#   kv/data/ci/dockerhub  username, token   (push)
#   kv/data/ci/github     dispatch_token    (dispatch)
# Repo/org vars: APP_NAME (e.g. iwillbegoogler), VAULT_ADDR, TELEGRAM_CHAT_ID, TELEGRAM_TOPIC_ID (optional).
on:
  push:
    # Literal on purpose: GitHub does not evaluate expressions in triggers.
    branches: [main] # dev: CI only (no dev environment)
  # Manual run: rebuild branch HEAD, or roll back by dispatching an existing tag.
  workflow_dispatch:
    inputs:
      rollback-tag:
        description: "Roll back: dispatch a deploy of this existing image tag (short sha, e.g. 8d777fa); skips build, scan and push. Empty = normal release."
        type: string
        default: ""

# Never cancel a release mid-way.
concurrency:
  group: cd-${{ github.ref_name == 'main' && 'production' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_meta.yml
    with:
      rollback-tag: ${{ inputs.rollback-tag }}

  # build -> scan -> push are skipped on a rollback: the image already exists.
  build:
    needs: meta
    if: needs.meta.outputs.rollback != 'true'
    uses: ./.github/workflows/_image-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      targets: &targets '["migrate","api","worker"]' # Dockerfile stages
      app-name: &app-name ${{ vars.APP_NAME }}
      artifact: true
      fail-fast: true

  scan:
    needs: build
    uses: ./.github/workflows/_image-scan.yml
    with:
      targets: *targets
      app-name: *app-name

  # Only after every image passed the scan, so a release is all or nothing.
  push:
    needs: [meta, scan]
    permissions:
      contents: read
      id-token: write # Vault JWT login
    uses: ./.github/workflows/_image-push.yml
    with:
      environment: &environment ${{ needs.meta.outputs.environment }}
      tag: &tag ${{ needs.meta.outputs.tag }}
      targets: *targets
      app-name: *app-name

  # Tell the infra repo to roll out <tag>. Runs after a successful push, or
  # straight after meta on a manual rollback. Job id stays `deploy` (notify reads it).
  deploy:
    needs: [meta, push]
    if: >-
      always() && needs.meta.result == 'success' &&
      (needs.push.result == 'success' || needs.meta.outputs.rollback == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.meta.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Vault secrets
        id: vault
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          jwtGithubAudience: iwillbegoogler-vault
          role: iwillbegoogler-ci-images
          exportEnv: false
          secrets: |
            kv/data/ci/github dispatch_token | DISPATCH_TOKEN

      - name: Dispatch deploy
        env:
          DISPATCH_TOKEN: ${{ steps.vault.outputs.DISPATCH_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          ENV_NAME: ${{ needs.meta.outputs.environment }}
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg tag "$TAG" --arg env "$ENV_NAME" '{event_type: "deploy", client_payload: {service: "backend", tag: $tag, environment: $env}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/bakhod1r/iwillbegoogler-infra/dispatches \
            -d "$payload"
          echo "::notice::Dispatched deploy backend:$TAG ($ENV_NAME) to iwillbegoogler-infra"

  notify:
    needs: [meta, build, scan, push, deploy]
    if: always() && needs.meta.result == 'success'
    uses: ./.github/workflows/_notify.yml
    with:
      environment: *environment
      mode: cd
      results: ${{ toJSON(needs) }}
      tag: *tag
      branch: ${{ github.ref_name }}
      title: ${{ needs.meta.outputs.rollback == 'true' && format('rollback to {0}', inputs.rollback-tag) || github.event.head_commit.message || 'manual release' }}
      url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
