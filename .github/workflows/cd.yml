name: CD

# Release pipeline for main (production):
#   meta -> build -> scan -> push (GHCR) -> deploy (self-hosted runner on the server, docker pull/run via .github/scripts/deploy-docker.sh) -> notify
# Backend runs as plain `docker run` containers (api, worker; migrate one-shot) next to the existing stack; no compose files
# are used. _deploy.yml and _env.yml (old SSH deploy) are unused legacy.
# Images: ghcr.io/iwillbegoogler/iwillbegoogler-{migrate,api,worker}:<short sha>
#
# Push uses the workflow GITHUB_TOKEN (packages: write); the deploy job logs the server in to ghcr.io with the run's token
# (packages: read) for the pull, then logs out. Vault via GitHub OIDC (JWT auth) is used only for the deploy:
#   role iwillbegoogler-production-ci      issue/destroy secret_ids of AppRole iwillbegoogler-production (deploy)
# Repo/org vars: APP_NAME (e.g. iwillbegoogler), VAULT_ADDR, TELEGRAM_CHAT_ID, TELEGRAM_TOPIC_ID (optional).
on:
  push:
    # Literal on purpose: GitHub does not evaluate expressions in triggers.
    branches: [main] # dev: CI only (no dev environment)
  # Manual run: rebuild branch HEAD, or roll back by dispatching an existing tag.
  workflow_dispatch:
    inputs:
      rollback-tag:
        description: "Roll back: dispatch a deploy of this existing image tag (short sha, e.g. 8d777fa); skips build, scan and push. Empty = normal release."
        type: string
        default: ""

# Never cancel a release mid-way.
concurrency:
  group: cd-${{ github.ref_name == 'main' && 'production' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_meta.yml
    with:
      rollback-tag: ${{ inputs.rollback-tag }}

  # build -> scan -> push are skipped on a rollback: the image already exists.
  build:
    needs: meta
    if: needs.meta.outputs.rollback != 'true'
    uses: ./.github/workflows/_image-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      targets: &targets '["migrate","api","worker"]' # Dockerfile stages
      app-name: &app-name ${{ vars.APP_NAME }}
      artifact: true
      fail-fast: true

  scan:
    needs: build
    uses: ./.github/workflows/_image-scan.yml
    with:
      targets: *targets
      app-name: *app-name

  # Only after every image passed the scan, so a release is all or nothing.
  push:
    needs: [meta, scan]
    permissions:
      contents: read
      packages: write # GHCR push with GITHUB_TOKEN
    uses: ./.github/workflows/_image-push.yml
    with:
      environment: &environment ${{ needs.meta.outputs.environment }}
      tag: &tag ${{ needs.meta.outputs.tag }}
      targets: *targets
      app-name: *app-name

  # Roll out <tag> on the server: self-hosted runner there (label iwillbegoogler-prod, deploy user). GitHub OIDC ->
  # Vault role iwillbegoogler-<env>-ci -> deploy-docker.sh: fresh wrapped secret_id, docker pull, migrate (docker run),
  # api + worker replaced with docker run (health check, previous containers restored on failure), old secret_ids destroyed.
  # Runs after a successful push, or straight after meta on a manual rollback. Job id stays `deploy` (notify reads it).
  deploy:
    needs: [meta, push]
    if: >-
      always() && needs.meta.result == 'success' &&
      (needs.push.result == 'success' || needs.meta.outputs.rollback == 'true')
    runs-on: [iwillbegoogler-prod] # runner is registered with --no-default-labels (runner.sh): it has no `self-hosted` label
    timeout-minutes: 30
    environment: ${{ needs.meta.outputs.environment }}
    permissions:
      contents: read
      id-token: write
      packages: read # ghcr.io pull
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Vault login (GitHub OIDC)
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: iwillbegoogler-${{ needs.meta.outputs.environment }}-ci
          jwtGithubAudience: iwillbegoogler-vault
          exportToken: true

      - name: GHCR login (pull)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Deploy
        env:
          ENV_NAME: ${{ needs.meta.outputs.environment }}
          TAG: ${{ needs.meta.outputs.tag }}
          IMAGE_NAME: ghcr.io/iwillbegoogler/iwillbegoogler
        run: bash .github/scripts/deploy-docker.sh

      - name: GHCR logout
        if: always()
        run: docker logout ghcr.io || true

  notify:
    needs: [meta, build, scan, push, deploy]
    if: always() && needs.meta.result == 'success'
    uses: ./.github/workflows/_notify.yml
    with:
      environment: *environment
      mode: cd
      results: ${{ toJSON(needs) }}
      tag: *tag
      title: ${{ needs.meta.outputs.rollback == 'true' && format('rollback to {0}', inputs.rollback-tag) || '' }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
