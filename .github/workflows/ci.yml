name: CI

# Checks every PR into dev or main before it can be merged (branch protection).
#   lint + vuln + test + build -> scan (images, not pushed) -> notify
# Jobs are reusable workflows (_*.yml, defaults in their inputs); this file
# passes only what is specific to this service. Long steps are plain scripts in ../scripts/.
# Deploys are CD's job: a merged PR is a push to its base branch, CD runs then.
on:
  pull_request:
    # Literal on purpose: GitHub does not evaluate expressions in triggers.
    branches: [main, dev]
  push:
    branches: [dev] # integration branch: CI only, main is checked by cd.yml

# A newer push to the same PR makes the older run stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_go-lint.yml

  # infra/: server scripts, compose stack, workflows
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        run: find infra/deploy -type f \( -name '*.sh' -o -name iwillbegoogler-secrets \) -print0 | xargs -0 shellcheck -x -S warning
      - name: compose config
        env: # written by iwillbegoogler-secrets render on the server
          VAULT_ADDR: https://vault.example:8200
          VAULT_ROLE_ID: ci-dummy
          VAULT_KV_PATH: kv/data/iwillbegoogler/production
        run: |
          mkdir -p infra/Backend && cp docker-compose.yml infra/Backend/ # server layout: $DEPLOY_DIR/Backend/docker-compose.yml
          cd infra
          docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml -f deploy/proxy/docker-compose.behind-nginx.yml config -q
          sh deploy/check-env.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  vuln:
    uses: ./.github/workflows/_go-vuln.yml

  test:
    uses: ./.github/workflows/_go-test.yml

  # Nothing is pushed (CD builds and pushes after merge); tarballs only feed scan.
  build:
    uses: ./.github/workflows/_image-build.yml
    with:
      targets: &targets '["migrate","api","worker"]' # Dockerfile stages
      app-name: &app-name ${{ vars.APP_NAME }} # repository var: local image prefix
      version: pr-${{ github.event.pull_request.number }}
      artifact: true
      timeout-minutes: 10

  # Same gate as CD: a CVE fails the PR, not the deploy after merge.
  scan:
    needs: build
    uses: ./.github/workflows/_image-scan.yml
    with:
      targets: *targets
      app-name: *app-name

  notify:
    needs: [lint, vuln, test, build, scan]
    if: always()
    uses: ./.github/workflows/_notify.yml
    with:
      # PR into main -> production Telegram topic, anything else -> dev.
      environment: ${{ github.base_ref == 'main' && 'production' || 'dev' }}
      mode: ci
      results: ${{ toJSON(needs) }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
