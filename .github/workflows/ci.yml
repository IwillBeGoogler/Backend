name: CI

# Checks every PR into dev or main before it can be merged (branch protection).
#   lint + vuln + test + build -> scan (images, not pushed) -> notify
# Jobs are reusable workflows (_*.yml, defaults in their inputs); this file
# passes only what is specific to this service. Long steps are plain scripts in ../scripts/.
# Deploys are CD's job: a merged PR is a push to its base branch, CD runs then.
on:
  pull_request:
    # Literal on purpose: GitHub does not evaluate expressions in triggers.
    branches: [main, dev]
  push:
    branches: [dev] # integration branch: CI only, main is checked by cd.yml

# A newer push to the same PR makes the older run stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_go-lint.yml

  # workflow files and the deploy scripts (infra/ is gone: the stack lives on the server)
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: find .github/scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -S warning

  vuln:
    uses: ./.github/workflows/_go-vuln.yml

  test:
    uses: ./.github/workflows/_go-test.yml

  # Nothing is pushed (CD builds and pushes after merge); tarballs only feed scan.
  build:
    uses: ./.github/workflows/_image-build.yml
    with:
      targets: &targets '["migrate","api","worker"]' # Dockerfile stages
      app-name: &app-name ${{ vars.APP_NAME }} # repository var: local image prefix
      version: pr-${{ github.event.pull_request.number }}
      artifact: true
      timeout-minutes: 10

  # Same gate as CD: a CVE fails the PR, not the deploy after merge.
  scan:
    needs: build
    uses: ./.github/workflows/_image-scan.yml
    with:
      targets: *targets
      app-name: *app-name

  notify:
    needs: [lint, vuln, test, build, scan]
    if: always()
    permissions:
      contents: read
      actions: read # _notify reads job results and logs
    uses: ./.github/workflows/_notify.yml
    with:
      # PR into main -> production Telegram topic, anything else -> dev.
      environment: ${{ github.base_ref == 'main' && 'production' || 'dev' }}
      mode: ci
      results: ${{ toJSON(needs) }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
