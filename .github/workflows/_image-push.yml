name: image-push

# Reusable: loads the scanned tarballs and pushes <IMAGE_NAME>-<target>:<tag>.
# Only the immutable sha tag: deploys and rollbacks never depend on :latest.
# Docker Hub credentials come from Vault (GitHub OIDC, JWT auth), not GitHub secrets:
# kv/data/ci/dockerhub keys username, token. Needs repo/org var VAULT_ADDR.
# The caller must grant `id-token: write`.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true, description: "GitHub environment (vars, secrets)" }
      tag: { type: string, required: true, description: image tag (short sha) }
      targets: { type: string, required: true, description: 'JSON array of Dockerfile stages, e.g. ["api","worker"]' }
      app-name: { type: string, required: true, description: local image and artifact prefix }
      image-name: { type: string, default: docker.io/bakhod1r/iwillbegoogler, description: "registry image prefix; pushes <image-name>-<target>:<tag>" }
      vault-role: { type: string, default: iwillbegoogler-ci-images, description: Vault JWT role }
      vault-secret-path: { type: string, default: kv/data/ci/dockerhub, description: Vault KV v2 path with username and token }
      runner: { type: string, default: ubuntu-24.04, description: runner label }
      timeout-minutes: { type: number, default: 10, description: job timeout }

permissions:
  contents: read
  id-token: write

jobs:
  push:
    name: Push (${{ matrix.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Download image
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.app-name }}-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Vault secrets
        id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          jwtGithubAudience: iwillbegoogler-vault
          role: ${{ inputs.vault-role }}
          exportEnv: false
          secrets: |
            ${{ inputs.vault-secret-path }} username | DOCKERHUB_USERNAME ;
            ${{ inputs.vault-secret-path }} token | DOCKERHUB_TOKEN

      - name: Docker login
        uses: docker/login-action@v4.8.0
        with:
          registry: docker.io
          username: ${{ steps.vault.outputs.DOCKERHUB_USERNAME }}
          password: ${{ steps.vault.outputs.DOCKERHUB_TOKEN }}

      - name: Docker push
        env:
          TARBALL: ${{ runner.temp }}/${{ matrix.target }}.tar
          LOCAL: ${{ inputs.app-name }}-${{ matrix.target }}:${{ github.sha }}
          IMAGE_NAME: ${{ inputs.image-name }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/image-push.sh
